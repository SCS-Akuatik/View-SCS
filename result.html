<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Result | SCS</title>
    <link rel="stylesheet" href="/src/style.css">
    <style>
        .spin-anim { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 pb-20">

    <!-- Top Action Bar (Header) -->
    <div class="bg-slate-900 text-white sticky top-0 z-50 shadow-md">
        <div class="max-w-3xl mx-auto px-4 py-3 flex justify-between items-center">
            <div>
                <h1 id="headerEventName" class="text-sm font-black tracking-widest text-white uppercase truncate max-w-[200px] md:max-w-md">MEMUAT EVENT...</h1>
                <div class="flex items-center gap-2 mt-0.5">
                    <span class="flex items-center gap-1 text-[10px] font-bold text-red-400 bg-red-900/50 px-1.5 py-0.5 rounded">
                        <span class="w-1.5 h-1.5 rounded-full bg-red-500 animate-pulse"></span> ON AIR
                    </span>
                    <p class="text-[10px] text-slate-400">Official Live Result</p>
                </div>
            </div>

            <!-- Auto Refresh Status & Button -->
            <div class="flex items-center gap-3">
                <div class="text-right hidden sm:block">
                    <p class="text-[10px] text-slate-400 font-bold uppercase">Update Otomatis</p>
                    <p id="countdownText" class="text-xs font-mono font-bold text-emerald-400">30s</p>
                </div>
                <button id="btnRefresh" class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center border border-slate-700 hover:bg-slate-700 transition-colors active:scale-95 shadow-sm text-slate-300">
                    <svg id="iconRefresh" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                </button>
            </div>
        </div>
        <!-- Progress Bar Auto Refresh -->
        <div class="w-full bg-slate-800 h-1">
            <div id="refreshProgressBar" class="bg-emerald-500 h-1 w-full transition-all duration-1000 ease-linear"></div>
        </div>
    </div>

    <div class="max-w-3xl mx-auto px-4 mt-6">
        
        <!-- Filter Lomba (Dropdown) -->
        <div class="bg-white p-4 md:p-5 rounded-2xl shadow-sm border border-slate-200 mb-6">
            <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Pilih Nomor Lomba</label>
            <select id="selectEvent" class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-sm font-bold focus:ring-2 focus:ring-blue-500 outline-none transition-shadow">
                <option value="">Memuat Lomba...</option>
            </select>
        </div>

        <!-- Container Hasil Heats -->
        <div id="resultContainer" class="space-y-6">
            <!-- Tampilan Default Sebelum Pilih Lomba -->
            <div class="text-center py-10 opacity-50">
                <div class="text-4xl mb-3">🏊‍♂️</div>
                <h3 class="text-sm font-bold text-slate-600">Pilih lomba di atas untuk melihat hasil Heat.</h3>
            </div>
        </div>

    </div>

    <!-- Script JS -->
    <script type="module" src="/src/result.js"></script>
</body>
</html>
