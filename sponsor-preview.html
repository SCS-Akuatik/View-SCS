<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etalase Sponsor | SCS Super Admin</title>
    <link rel="stylesheet" href="/src/style.css">
</head>
<body class="bg-slate-900 min-h-screen font-sans text-slate-200">
    
    <!-- Navbar Super Admin -->
    <nav class="bg-black shadow-lg px-4 md:px-8 py-4 border-b border-amber-500/30 flex justify-between items-center sticky top-0 z-50">
        <div class="font-black text-amber-500 tracking-widest uppercase flex items-center gap-2">
            <span>💎</span> Etalase Sponsor SCS
        </div>
        <a href="/admin-ads.html" class="text-xs font-bold text-slate-400 hover:text-white transition-colors bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">
            Kembali ke Admin
        </a>
    </nav>

    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-8">
        <div class="mb-8 border-b border-slate-800 pb-5">
            <h1 class="text-3xl font-black text-white">Etalase Master Sponsor</h1>
            <p class="text-slate-400 text-sm mt-1">Katalog resmi seluruh aset sponsor yang tersimpan di dalam <code class="text-amber-400 bg-amber-900/20 px-1 rounded">master_sponsors</code>.</p>
        </div>

        <!-- Indikator Loading -->
        <div id="loadingState" class="text-center py-20 animate-pulse">
            <span class="text-4xl block mb-4">⏳</span>
            <p class="text-amber-500 font-bold tracking-widest uppercase text-sm">Menarik data dari brankas...</p>
        </div>

        <!-- Grid Etalase Sponsor -->
        <div id="sponsorGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6 hidden">
            <!-- Kartu sponsor bakal diinjeksi lewat JS ke sini -->
        </div>
    </div>

    <script type="module" src="/src/sponsor-preview.js"></script>
</body>
</html>
