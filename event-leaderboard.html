<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official Leaderboard | SCS</title>
    <link rel="stylesheet" href="/src/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800 pb-20">

    <!-- NAVBAR -->
    <nav class="bg-slate-900 text-white shadow-md px-4 py-4 sticky top-0 z-50 border-b-2 border-amber-500">
        <div class="max-w-4xl mx-auto flex flex-col gap-1">
            <h1 class="text-sm font-bold text-amber-400">🏆 Hasil Resmi Pertandingan (Leaderboard)</h1>
            <h2 id="eventName" class="text-lg font-black tracking-tight truncate">Memuat Nama Event...</h2>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto px-4 py-6">
        
        <!-- WADAH BANNER SPONSOR UTAMA (Top Banner) -->
        <div id="partnerWrapper"></div>

        <div class="mb-6 flex justify-between items-end border-b border-slate-200 pb-4">
            <div>
                <h3 class="font-black text-2xl text-slate-800">Daftar Juara</h3>
                <p class="text-sm text-slate-500 font-bold">Unduh E-Certificate Pemenang di sini.</p>
            </div>
        </div>

        <div id="loadingIndicator" class="text-center py-10 text-slate-400 font-bold text-sm">
            ⏳ Menarik data dari meja wasit...
        </div>

        <!-- WADAH LIST JUARA -->
        <div id="leaderboardList" class="space-y-6 hidden">
            <!-- Di-generate lewat JS -->
        </div>

    </div>

    <!-- CANVAS TERSEMBUNYI UNTUK CETAK SERTIFIKAT JUARA -->
    <canvas id="renderCanvas" class="hidden"></canvas>

    <script type="module" src="/src/event-leaderboard.js"></script>
</body>
</html>
