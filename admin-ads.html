<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1e3a8a">
    <link rel="apple-touch-icon" href="/images/logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCS Super Admin | Ads & Sponsor</title>
    <link rel="stylesheet" href="/src/style.css">
</head>
<body class="bg-slate-900 min-h-screen font-sans text-slate-200 pb-20">

    <!-- Navbar Super Admin -->
    <nav class="bg-black shadow-lg px-4 md:px-6 py-4 flex justify-between items-center sticky top-0 z-50 border-b border-amber-500/30">
        <a href="/dashboard.html" class="flex items-center gap-2 text-slate-400 hover:text-white transition text-sm font-bold">
            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Kembali
        </a>
        <div class="flex items-center gap-2">
            <span class="text-xs font-black tracking-widest text-amber-500 uppercase bg-amber-900/20 px-3 py-1 rounded shadow-inner">👑 SUPER ADMIN</span>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-4xl mx-auto px-4 sm:px-6 pt-8">
        
        <div class="mb-8 border-b border-slate-800 pb-5">
            <h1 class="text-3xl font-black text-white tracking-tight flex items-center gap-3">
                <span>💰</span> Ad Network & Sponsorship
            </h1>
            <p class="text-slate-400 text-sm mt-2">Pusat kontrol distribusi iklan ke Buku Acara (A4), Live Result, dan Leaderboard.</p>
        </div>

        <!-- 1. PILIH EVENT -->
        <div class="bg-slate-800 rounded-2xl shadow-xl border border-slate-700 p-6 mb-8">
            <label class="block text-sm font-black text-amber-400 mb-2 uppercase tracking-widest">1. Target Event Lomba</label>
            <p class="text-xs text-slate-400 mb-4">Pilih event yang akan disuntikkan iklan sponsor.</p>
            
            <div class="relative">
                <select id="eventSelector" class="w-full bg-slate-900 border border-slate-600 text-white font-bold px-4 py-3 rounded-xl appearance-none outline-none focus:ring-2 focus:ring-amber-500 transition-shadow cursor-pointer">
                    <option value="">⏳ Memuat daftar event...</option>
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </div>
            </div>
        </div>

        <!-- 2. WORKSPACE ADS BUILDER (Hidden by default) -->
        <div id="adsWorkspace" class="hidden space-y-6 animate-fade-in">
            
            <div class="bg-slate-800 rounded-2xl shadow-xl border border-slate-700 p-6">
                <label class="block text-sm font-black text-amber-400 mb-4 uppercase tracking-widest border-b border-slate-700 pb-2">2. Materi Iklan Sponsor</label>
                
                <div class="space-y-6">
                    <!-- Text Sponsor -->
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">Nama Sponsor / Brand</label>
                        <input type="text" id="inputSponsorName" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-3 text-sm text-white font-bold focus:ring-2 focus:ring-amber-500 outline-none" placeholder="Contoh: Speedo Indonesia">
                    </div>

                    <!-- URL Redirect -->
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">URL Redirect (Tujuan Klik)</label>
                        <input type="url" id="inputSponsorUrl" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-3 text-sm text-blue-400 font-mono focus:ring-2 focus:ring-amber-500 outline-none" placeholder="https://...">
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-4 border-t border-slate-700">
                        <!-- Asset 1: Logo Banner -->
                        <div class="bg-slate-900 p-4 rounded-xl border border-slate-700">
                            <label class="block text-xs font-bold text-slate-300 mb-1 flex justify-between">
                                <span>Logo Sponsor (Header UI)</span>
                                <span class="text-slate-500 text-[10px]">PNG Transparan</span>
                            </label>
                            <input type="file" id="uploadLogo" accept="image/png, image/jpeg" class="w-full text-xs file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:font-bold file:bg-slate-700 file:text-white hover:file:bg-slate-600 cursor-pointer text-slate-400 mb-3 outline-none">
                            <div class="w-full h-24 bg-white rounded-lg border-2 border-dashed border-slate-600 flex items-center justify-center p-2 relative overflow-hidden">
                                <span class="text-xs text-slate-400 font-bold z-0">Preview Logo</span>
                                <img id="previewLogo" src="" class="hidden absolute w-full h-full object-contain z-10">
                            </div>
                        </div>

                        <!-- Asset 2: Sampul A4 -->
                        <div class="bg-slate-900 p-4 rounded-xl border border-slate-700">
                            <label class="block text-xs font-bold text-slate-300 mb-1 flex justify-between">
                                <span>Sampul A4 (Buku Acara)</span>
                                <span class="text-slate-500 text-[10px]">JPG/PNG (Potrait)</span>
                            </label>
                            <input type="file" id="uploadCover" accept="image/png, image/jpeg" class="w-full text-xs file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:font-bold file:bg-slate-700 file:text-white hover:file:bg-slate-600 cursor-pointer text-slate-400 mb-3 outline-none">
                            <div class="w-full h-40 bg-slate-800 rounded-lg border-2 border-dashed border-slate-600 flex items-center justify-center p-2 relative overflow-hidden">
                                <span class="text-xs text-slate-500 font-bold z-0 text-center">Preview Cover<br>(Kertas A4)</span>
                                <img id="previewCover" src="" class="hidden absolute w-full h-full object-contain z-10">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ACTION BUTTON -->
            <button id="btnSaveAds" class="w-full bg-amber-600 hover:bg-amber-500 text-black font-black py-4 rounded-xl shadow-[0_0_20px_rgba(217,119,6,0.3)] transition-all text-lg flex justify-center items-center gap-2">
                🚀 SUNTIKKAN IKLAN KE EVENT
            </button>
            <div id="statusMsg" class="hidden text-sm font-bold text-center rounded-lg p-3"></div>

        </div>

    </div>

    <script type="module" src="/src/admin-ads.js"></script>
    <style>
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</body>
</html>
