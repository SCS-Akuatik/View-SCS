<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCS PRO | Mesin Sertifikat</title>
    <link rel="stylesheet" href="/src/style.css">
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800 pb-20">

    <nav class="bg-slate-900 text-white shadow-md px-4 md:px-6 py-3 flex justify-between items-center sticky top-0 z-50">
        <button onclick="window.history.back()" class="flex items-center gap-2 text-slate-300 hover:text-white transition text-sm font-medium">
            <span>&laquo;</span> Kembali ke Dashboard
        </button>
        <div class="text-[10px] font-black tracking-widest text-amber-400 uppercase bg-amber-900/30 px-2 py-1 rounded border border-amber-700/50">PRO FEATURE</div>
    </nav>

    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-8">
        <div class="mb-8">
            <h1 class="text-2xl md:text-3xl font-extrabold text-slate-900 tracking-tight flex items-center gap-2">
                📜 Setup E-Sertifikat 
            </h1>
            <p class="text-sm text-slate-500 mt-1">Unggah template kosong dan atur koordinat cetak otomatis.</p>
        </div>

        <!-- TABS NAVIGASI -->
        <div class="flex gap-2 mb-6 border-b border-slate-200 pb-4 overflow-x-auto hide-scrollbar">
            <button id="tabPeserta" class="px-6 py-2.5 rounded-full font-bold text-sm bg-blue-900 text-white shadow transition-all shrink-0">1. Sertifikat Peserta</button>
            <button id="tabJuara" class="px-6 py-2.5 rounded-full font-bold text-sm bg-white border border-slate-200 text-slate-500 hover:bg-slate-50 transition-all shrink-0">2. Sertifikat Juara (Per KU)</button>
            <button id="tabMVS" class="px-6 py-2.5 rounded-full font-bold text-sm bg-white border border-slate-200 text-slate-500 hover:bg-slate-50 transition-all shrink-0">3. Sertifikat MVS</button>
        </div>

        <!-- AREA KERJA -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- PANEL KIRI: FORM & KOORDINAT -->
            <div class="lg:col-span-1 space-y-6">
                <!-- Upload Box -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <h3 class="font-bold text-slate-800 mb-3 flex items-center gap-2"><span>🖼️</span> Upload Template (JPG/PNG)</h3>
                    <input type="file" id="uploadTemplate" accept="image/jpeg, image/png" class="w-full text-xs file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:font-bold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                    <p class="text-[10px] text-slate-400 mt-2">*Gunakan gambar ukuran A4 Landscape kosong tanpa nama.</p>
                </div>

                <!-- Setup Koordinat X, Y -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200" id="panelKoordinat" style="display: none;">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-bold text-slate-800">Atur Posisi Teks</h3>
                        <button id="btnRenderPreview" class="text-[10px] bg-indigo-100 text-indigo-700 px-2 py-1 rounded font-bold hover:bg-indigo-200">🔄 Refresh Preview</button>
                    </div>
                    
                    <div class="space-y-4">
                        <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                            <label class="block text-xs font-bold text-slate-700 mb-2">Posisi NAMA ATLET</label>
                            <div class="grid grid-cols-2 gap-2">
                                <div><span class="text-[10px] text-slate-400">X (Kiri-Kanan)</span><input type="number" id="coordNameX" value="1485" class="w-full px-2 py-1.5 text-sm border rounded outline-none"></div>
                                <div><span class="text-[10px] text-slate-400">Y (Atas-Bawah)</span><input type="number" id="coordNameY" value="1050" class="w-full px-2 py-1.5 text-sm border rounded outline-none"></div>
                            </div>
                        </div>

                        <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                            <label class="block text-xs font-bold text-slate-700 mb-2">Posisi NAMA KLUB</label>
                            <div class="grid grid-cols-2 gap-2">
                                <div><span class="text-[10px] text-slate-400">X (Kiri-Kanan)</span><input type="number" id="coordClubX" value="1485" class="w-full px-2 py-1.5 text-sm border rounded outline-none"></div>
                                <div><span class="text-[10px] text-slate-400">Y (Atas-Bawah)</span><input type="number" id="coordClubY" value="1200" class="w-full px-2 py-1.5 text-sm border rounded outline-none"></div>
                            </div>
                        </div>

                        <div id="panelJuaraExtra" class="hidden space-y-4">
                            <div class="bg-amber-50 p-3 rounded-xl border border-amber-100">
                                <label class="block text-xs font-bold text-amber-900 mb-2">Posisi NOMOR LOMBA</label>
                                <div class="grid grid-cols-2 gap-2">
                                    <div><input type="number" id="coordEventX" value="1485" class="w-full px-2 py-1.5 text-sm border rounded outline-none bg-white"></div>
                                    <div><input type="number" id="coordEventY" value="1350" class="w-full px-2 py-1.5 text-sm border rounded outline-none bg-white"></div>
                                </div>
                            </div>
                            <div class="bg-emerald-50 p-3 rounded-xl border border-emerald-100">
                                <label class="block text-xs font-bold text-emerald-900 mb-2">Posisi WAKTU / CATATAN</label>
                                <div class="grid grid-cols-2 gap-2">
                                    <div><input type="number" id="coordTimeX" value="1485" class="w-full px-2 py-1.5 text-sm border rounded outline-none bg-white"></div>
                                    <div><input type="number" id="coordTimeY" value="1500" class="w-full px-2 py-1.5 text-sm border rounded outline-none bg-white"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <button id="btnSaveConfig" class="w-full mt-6 bg-emerald-600 text-white font-bold py-3 rounded-xl hover:bg-emerald-700 transition shadow-lg">💾 Simpan Template ke Server</button>
                    <p id="statusMsg" class="text-xs text-center mt-3 font-bold hidden"></p>
                </div>
            </div>

            <!-- PANEL KANAN: PREVIEW CANVAS -->
            <div class="lg:col-span-2">
                <div class="bg-slate-200 p-2 rounded-2xl border-4 border-dashed border-slate-300 flex items-center justify-center min-h-[500px] overflow-hidden relative" id="canvasContainer">
                    <p class="text-slate-400 font-bold" id="placeholderCanvas">Preview Sertifikat Akan Muncul Di Sini</p>
                    <canvas id="certCanvas" class="hidden max-w-full h-auto bg-white shadow-2xl rounded"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/book/event-sertifikat.js"></script>
</body>
</html>
