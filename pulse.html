<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCS Pulse | Live F1 ID Network</title>
    <link rel="stylesheet" href="/src/style.css">
    <style>
        /* Efek grid radar di background */
        .bg-grid {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        }
        /* Animasi text masuk buat Live Feed */
        .feed-enter { animation: slideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideIn { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
        
        /* 🔥 ANIMASI SPONSOR MELAYANG (MUSTANG GT BODY) 🔥 */
        .float-anim { animation: floatLogo 6s ease-in-out infinite; }
        .float-anim:nth-child(even) { animation-duration: 8s; animation-direction: reverse; }
        .float-anim:nth-child(3n) { animation-duration: 7s; animation-delay: 1s; }
        @keyframes floatLogo {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        /* Animasi kedip pas diklik */
        .click-ping { animation: clickPulse 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes clickPulse { 
            0% { transform: scale(1); } 
            50% { transform: scale(1.3); background-color: #f59e0b; color: white; } 
            100% { transform: scale(1); } 
        }
    </style>
</head>
<body class="bg-black text-white h-screen w-screen overflow-hidden font-sans relative flex flex-col selection:bg-amber-500 selection:text-black">

    <!-- Latar Belakang -->
    <div class="absolute inset-0 bg-grid z-0"></div>
    <div class="absolute inset-0 bg-gradient-to-b from-black via-transparent to-black z-0 pointer-events-none"></div>

    <!-- AREA SPONSOR MELAYANG (Z-index di antara grid dan konten utama) -->
    <div id="floatingSponsorsArea" class="absolute inset-0 z-[5] pointer-events-none overflow-hidden">
        <!-- JS Akan Suntik PNG Sponsor Melayang Di Sini -->
    </div>

    <!-- Header / Sponsor Watermark -->
    <div class="relative z-10 p-6 md:p-10 flex justify-between items-start pointer-events-none">
        <div>
            <div class="flex items-center gap-3 mb-2">
                <span class="relative flex h-3 w-3">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span>
                </span>
                <span class="text-red-500 font-mono font-bold tracking-widest text-xs uppercase">SCS Live Pulse Active</span>
            </div>
            <h1 class="text-2xl font-black text-slate-300 tracking-widest uppercase opacity-50">Global F1 ID Network</h1>
        </div>
        
        <div class="text-right pointer-events-auto">
            <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest block mb-2">Infrastructure Supported By:</span>
            <div class="bg-white/10 backdrop-blur-sm p-3 rounded-xl border border-white/10 inline-block">
                <h2 class="text-xl font-black text-amber-400 tracking-widest uppercase">YOUR BRAND HERE</h2>
            </div>
        </div>
    </div>

    <!-- CENTERPIECE: The Social Network Counter -->
    <div class="relative z-10 flex-1 flex flex-col items-center justify-center -mt-10 pointer-events-none">
        <p class="text-slate-400 font-bold uppercase tracking-[0.3em] mb-4 text-sm md:text-base text-center">Total Athlete Registered</p>
        
        <div class="flex items-center gap-2 md:gap-4 font-mono font-black text-6xl md:text-[9rem] leading-none text-white drop-shadow-[0_0_40px_rgba(59,130,246,0.6)]" id="mainCounter">
            0
        </div>
        
        <div class="flex gap-12 mt-10 opacity-70">
            <div class="text-center">
                <p class="text-[10px] text-slate-500 uppercase tracking-widest font-bold mb-1">Clubs Registered</p>
                <p class="text-2xl font-black text-emerald-400 font-mono" id="clubCounter">0</p>
            </div>
            <div class="text-center">
                <p class="text-[10px] text-slate-500 uppercase tracking-widest font-bold mb-1">Events Executed</p>
                <p class="text-2xl font-black text-amber-400 font-mono" id="eventCounter">0</p>
            </div>
        </div>
    </div>

    <!-- BOTTOM LIVE FEED -->
    <div class="relative z-10 w-full max-w-4xl mx-auto mb-8 px-6 pointer-events-none">
        <p class="text-[9px] text-slate-500 uppercase tracking-widest font-bold mb-3 border-b border-slate-800 pb-2">Live Activity Log</p>
        <div id="liveFeedContainer" class="h-[120px] overflow-hidden flex flex-col justify-end space-y-2 relative">
            <div class="absolute inset-0 bg-gradient-to-t from-transparent via-transparent to-black z-10 pointer-events-none"></div>
        </div>
    </div>

    <script type="module" src="/src/pulse.js"></script>
</body>
</html>
