<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Acara (Heat Sheet) | SCS</title>
    <link rel="stylesheet" href="/src/style.css">
    <style>
        /* Gaya khusus cetak PDF */
        @media print {
            body { background: white; }
            .no-print { display: none !important; }
            .page-break { page-break-before: always; }
        }
        .a4-container {
            max-width: 210mm; /* Lebar A4 */
            margin: 0 auto;
            background: white;
            min-height: 297mm; /* Tinggi A4 */
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            padding: 10mm;
        }
    </style>
</head>
<body class="bg-slate-200 font-sans text-slate-800 pb-20">

    <!-- Top Action Bar (Tidak ikut tercetak di PDF) -->
    <div class="no-print bg-slate-900 text-white sticky top-0 z-50 shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <button onclick="window.history.back()" class="text-slate-300 hover:text-white flex items-center gap-1 text-sm font-bold transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    Kembali
                </button>
                <div class="h-4 w-px bg-slate-600"></div>
                <h1 class="text-sm font-black tracking-widest text-emerald-400">HEAT SHEET GENERATOR</h1>
            </div>
            <div class="flex gap-2">
                <button class="bg-blue-600 hover:bg-blue-700 px-4 py-1.5 rounded-lg text-xs font-bold transition-colors flex items-center gap-2">
                    📄 Export PDF
                </button>
                <button class="bg-emerald-600 hover:bg-emerald-700 px-4 py-1.5 rounded-lg text-xs font-bold transition-colors flex items-center gap-2">
                    📊 Export Excel
                </button>
            </div>
        </div>
    </div>

    <!-- Kertas A4 Buku Acara -->
    <div class="mt-8 mb-8 a4-container" id="printableArea">
        <!-- HEADER BUKU ACARA -->
        <div class="text-center mb-8 border-b-2 border-slate-800 pb-4">
            <h1 id="eventName" class="text-2xl font-black uppercase text-slate-900">MEMUAT EVENT...</h1>
            <p class="text-sm font-bold text-slate-600 mt-1">START LIST / HEAT SHEET</p>
        </div>

        <!-- CONTAINER HEAT (Di-render dari JS) -->
        <div id="heatContainer" class="space-y-8">
            <div class="text-center p-10 text-slate-400 font-bold animate-pulse">
                Memproses Algoritma Heat... ⏳
            </div>
        </div>
    </div>

    <!-- Panggil Logic Utama -->
    <script type="module" src="/book/book.js"></script>
</body>
</html>
