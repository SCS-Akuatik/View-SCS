<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etalase Sponsor | SCS Super Admin</title>
    <link rel="stylesheet" href="/src/style.css">
</head>
<body class="bg-slate-900 min-h-screen font-sans text-slate-200">
    
    <nav class="bg-black shadow-lg px-4 md:px-8 py-4 border-b border-amber-500/30 flex justify-between items-center sticky top-0 z-50">
        <div class="font-black text-amber-500 tracking-widest uppercase flex items-center gap-2">
            <span>💎</span> Etalase Sponsor SCS
        </div>
        <a href="/admin-ads.html" class="text-xs font-bold text-slate-400 hover:text-white transition-colors bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">
            Kembali ke Admin
        </a>
    </nav>

    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-8">
        <div class="mb-8 border-b border-slate-800 pb-5">
            <h1 class="text-3xl font-black text-white">Etalase Master Sponsor</h1>
            <p class="text-slate-400 text-sm mt-1">Katalog resmi seluruh aset sponsor yang tersimpan. <span class="text-emerald-400 font-bold">Klik kartu untuk mengedit.</span></p>
        </div>

        <div id="loadingState" class="text-center py-20 animate-pulse">
            <span class="text-4xl block mb-4">⏳</span>
            <p class="text-amber-500 font-bold tracking-widest uppercase text-sm">Menarik data dari brankas...</p>
        </div>

        <div id="sponsorGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6 hidden">
            <!-- Kartu sponsor diinjeksi lewat JS -->
        </div>
    </div>

    <!-- MODAL EDIT SPONSOR -->
    <div id="modalEditSponsor" class="fixed inset-0 bg-slate-900/90 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm transition-opacity overflow-y-auto">
        <div class="bg-slate-800 border border-slate-700 rounded-3xl max-w-2xl w-full shadow-2xl overflow-hidden my-auto">
            
            <div class="flex justify-between items-center p-5 border-b border-slate-700 bg-slate-900/50">
                <h3 class="font-black text-amber-400 text-lg uppercase tracking-widest flex items-center gap-2"><span>✏️</span> Edit Master Sponsor</h3>
                <button id="btnCloseModal" class="text-slate-400 hover:text-white transition-colors"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
            </div>

            <div class="p-5 md:p-6 space-y-5">
                <input type="hidden" id="editSponsorId">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">Nama Sponsor</label>
                        <input type="text" id="editSponsorName" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-3 text-sm text-white font-bold focus:ring-2 focus:ring-amber-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">URL Redirect</label>
                        <input type="url" id="editSponsorUrl" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-3 text-sm text-blue-400 font-mono focus:ring-2 focus:ring-amber-500 outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5 pt-2 border-t border-slate-700">
                    <div class="bg-slate-900/50 p-4 rounded-xl border border-slate-700">
                        <label class="block text-xs font-bold text-slate-300 mb-1 flex justify-between">
                            <span>Update Logo</span>
                            <span class="text-slate-500 text-[10px]">PNG Transparan</span>
                        </label>
                        <input type="file" id="editUploadLogo" accept="image/png, image/jpeg" class="w-full text-xs file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:font-bold file:bg-slate-700 file:text-white hover:file:bg-slate-600 cursor-pointer text-slate-400 mb-3 outline-none">
                        <div class="w-full h-24 bg-white rounded-lg border-2 border-dashed border-slate-600 flex items-center justify-center p-2 relative overflow-hidden">
                            <span class="text-xs text-slate-400 font-bold z-0">Preview</span>
                            <img id="editPreviewLogo" src="" class="hidden absolute w-full h-full object-contain z-10 p-1">
                        </div>
                    </div>

                    <div class="bg-slate-900/50 p-4 rounded-xl border border-slate-700">
                        <label class="block text-xs font-bold text-slate-300 mb-1 flex justify-between">
                            <span>Update Cover A4</span>
                            <span class="text-slate-500 text-[10px]">JPG/PNG</span>
                        </label>
                        <input type="file" id="editUploadCover" accept="image/png, image/jpeg" class="w-full text-xs file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:font-bold file:bg-slate-700 file:text-white hover:file:bg-slate-600 cursor-pointer text-slate-400 mb-3 outline-none">
                        <div class="w-full h-24 bg-slate-800 rounded-lg border-2 border-dashed border-slate-600 flex items-center justify-center p-2 relative overflow-hidden">
                            <span class="text-xs text-slate-500 font-bold z-0 text-center">Preview</span>
                            <img id="editPreviewCover" src="" class="hidden absolute w-full h-full object-contain z-10">
                        </div>
                    </div>
                </div>
                
                <div id="editStatusMsg" class="hidden text-sm font-bold text-center rounded-lg p-3"></div>
            </div>

            <div class="p-5 border-t border-slate-700 bg-slate-900/50 flex gap-3">
                <button id="btnDeleteSponsor" class="bg-red-900/50 hover:bg-red-800 border border-red-500/50 text-red-200 font-bold py-3 px-4 rounded-xl transition-colors shadow-sm flex items-center gap-2 text-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    Hapus
                </button>
                <button id="btnSaveSponsor" class="flex-1 bg-amber-600 hover:bg-amber-500 text-black font-black py-3 rounded-xl shadow-[0_0_15px_rgba(217,119,6,0.3)] transition-all text-sm flex justify-center items-center gap-2">
                    💾 SIMPAN PERUBAHAN
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="/src/sponsor-preview.js"></script>
</body>
</html>
