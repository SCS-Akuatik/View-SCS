<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 ID Profile | SCS</title>
    <link rel="stylesheet" href="/src/style.css">
    
    <!-- PANGGIL CHART.JS UNTUK GRAFIK -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 antialiased font-sans pb-20">

    <!-- HEADER PROFIL -->
    <div class="bg-blue-900 pt-10 pb-20 px-4 sm:px-6 lg:px-8 relative overflow-hidden rounded-b-[3rem] shadow-xl">
        <div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1519315901367-f34f927e1273?w=800&q=80')] opacity-10 bg-cover bg-center"></div>
        
        <div class="max-w-3xl mx-auto relative z-10 flex flex-col items-center text-center">
            <span id="f1IdBadge" class="bg-scsGold text-blue-900 font-black px-4 py-1.5 rounded-full text-xs uppercase tracking-widest mb-4 shadow-lg flex items-center gap-1.5">
                <span>🌊</span> Memuat...
            </span>
            
            <img id="f1Avatar" src="https://ui-avatars.com/api/?name=Loading&background=fff&color=1e3a8a&size=128&bold=true" class="w-24 h-24 rounded-full border-4 border-white shadow-xl mb-3 object-cover">
            <h1 id="f1Name" class="text-3xl font-black text-white tracking-tight">Memuat Data...</h1>
            <p class="text-blue-200 font-medium flex items-center gap-2 mt-1">
                <span id="f1Club">Loading Club...</span> <span id="f1Gender" class="bg-blue-800 text-white text-[10px] px-2 py-0.5 rounded border border-blue-700">-</span>
            </p>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 -mt-12 relative z-20">
        
        <!-- QUICK STATS -->
        <div class="bg-white rounded-3xl p-6 shadow-lg border border-gray-100 flex justify-between items-center mb-8 divide-x divide-gray-100">
            <div class="text-center px-4 flex-1">
                <p class="text-gray-400 text-xs font-bold uppercase tracking-wider mb-1">Total Event</p>
                <p id="statTotalEvent" class="text-2xl font-black text-blue-900">0</p>
            </div>
            <div class="text-center px-4 flex-1">
                <p class="text-gray-400 text-xs font-bold uppercase tracking-wider mb-1">Medali</p>
                <p id="statTotalMedal" class="text-2xl font-black text-scsGold">0</p>
            </div>
            <div class="text-center px-4 flex-1">
                <p class="text-gray-400 text-xs font-bold uppercase tracking-wider mb-1">Status</p>
                <p class="text-sm font-black text-green-500 mt-2 bg-green-50 rounded-full py-1">Aktif</p>
            </div>
        </div>

        <!-- CORE FEATURE: GRAFIK PROGRES SEED TIME -->
        <div class="bg-white rounded-3xl shadow-sm border border-gray-200 overflow-hidden mb-8">
            <div class="p-6 border-b border-gray-100 flex justify-between items-center">
                <div>
                    <h2 class="text-xl font-extrabold text-blue-900 flex items-center gap-2">
                        📈 Grafik Progres <span class="bg-red-500 text-white text-[9px] px-2 py-0.5 rounded-full animate-pulse">LIVE</span>
                    </h2>
                    <p class="text-xs text-gray-500 mt-1">Catatan waktu (Seed Time) di ekosistem SCS.</p>
                </div>
                <button id="btnBukaModal" class="bg-blue-900 hover:bg-blue-800 text-white text-xs font-bold py-2 px-4 rounded-xl shadow-md transition-all active:scale-95 flex items-center gap-2">
                    <span>+</span> Tambah Riwayat
                </button>
            </div>
            
            <div class="p-4 md:p-6 relative w-full h-[300px]">
                <canvas id="progressChart"></canvas>
            </div>

            <div class="bg-blue-50/50 p-4 border-t border-blue-100 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-scsGold rounded-full flex items-center justify-center text-xl shadow-md">🔥</div>
                    <div>
                        <p class="text-xs font-bold text-gray-500 uppercase tracking-wider">Personal Best (PB)</p>
                        <p class="font-bold text-blue-900 text-sm">Rekor Terbaik</p>
                    </div>
                </div>
                <div class="text-right">
                    <p class="text-2xl font-black text-blue-900" id="pbTime">NT</p>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL TAMBAH RIWAYAT MANUAL -->
    <div id="modalRiwayat" class="fixed inset-0 bg-slate-900/80 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-3xl max-w-md w-full shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="p-6 border-b border-slate-100 bg-slate-50">
                <h3 class="font-black text-slate-800 text-xl">Tambah Riwayat Lomba 🏊‍♂️</h3>
                <p class="text-xs text-slate-500 font-medium mt-1">Input catatan waktu manual (Otomatis Unverified).</p>
            </div>

            <div class="p-6 overflow-y-auto hide-scrollbar">
                <form id="formRiwayat" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1.5 uppercase">Nama Event</label>
                        <input type="text" id="inputNamaEvent" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm font-bold" placeholder="Cth: Walikota Cup 2026">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1.5 uppercase">Tanggal</label>
                        <input type="date" id="inputTanggal" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm font-bold">
                    </div>
                    
                    <div class="flex gap-4">
                        <div class="flex-1">
                            <label class="block text-xs font-bold text-slate-700 mb-1.5 uppercase">Gaya & Jarak</label>
                            <input list="listGaya" id="inputGaya" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm font-bold" placeholder="Cth: 50m Bebas">
                            <datalist id="listGaya">
                                <option value="50m Bebas">
                                <option value="100m Bebas">
                                <option value="50m Dada">
                                <option value="50m Kupu">
                                <option value="50m Punggung">
                                <option value="200m Ganti">
                            </datalist>
                        </div>
                        <div class="flex-1">
                            <label class="block text-xs font-bold text-slate-700 mb-1.5 uppercase">Waktu (Detik)</label>
                            <input type="number" step="0.01" id="inputWaktu" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm font-bold" placeholder="29.80">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1.5 uppercase">Medali</label>
                        <select id="inputMedali" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm font-bold">
                            <option value="">Tidak Ada</option>
                            <option value="Emas">🥇 Emas</option>
                            <option value="Perak">🥈 Perak</option>
                            <option value="Perunggu">🥉 Perunggu</option>
                        </select>
                    </div>
                    
                    <div id="alertModal" class="hidden text-xs font-bold p-3 rounded-xl border text-center leading-relaxed"></div>
                </form>
            </div>

            <div class="p-6 border-t border-slate-100 flex gap-3 bg-slate-50">
                <button id="btnTutupModal" class="flex-1 bg-white border border-slate-200 hover:bg-slate-100 text-slate-600 font-bold py-3 rounded-xl text-sm transition-colors">Batal</button>
                <button id="btnSimpanRiwayat" class="flex-1 bg-blue-900 hover:bg-blue-800 text-white font-bold py-3 rounded-xl text-sm shadow-md transition-colors flex items-center justify-center gap-2">Simpan Data</button>
            </div>
        </div>
    </div>

    <!-- Panggil Script -->
    <script type="module" src="/src/f1-profile.js"></script>
</body>
</html>
