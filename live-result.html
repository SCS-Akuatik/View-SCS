<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir Entry Time | SCS</title>
    <link rel="stylesheet" href="/src/style.css">
</head>
<body class="bg-slate-100 font-sans text-slate-800 pb-20">

    <!-- Top Action Bar -->
    <div class="bg-slate-900 text-white sticky top-0 z-50 shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <button onclick="window.history.back()" class="text-slate-300 hover:text-white flex items-center gap-1 text-sm font-bold transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    Kembali
                </button>
                <div class="h-4 w-px bg-slate-600"></div>
                <h1 class="text-sm font-black tracking-widest text-red-400 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span> ENTRY TIME
                </h1>
            </div>
        </div>
    </div>

    <div class="max-w-4xl mx-auto px-4 mt-6">
        
        <!-- Control Panel: Pilih Lomba & Heat -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 mb-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">1. Pilih Nomor Lomba</label>
                    <select id="selectEvent" class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-sm font-bold focus:ring-2 focus:ring-red-500 outline-none">
                        <option value="">Memuat Lomba...</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">2. Pilih Heat</label>
                    <select id="selectHeat" class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-sm font-bold focus:ring-2 focus:ring-red-500 outline-none disabled:opacity-50" disabled>
                        <option value="">Pilih Lomba Terlebih Dahulu</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Form Input Waktu -->
        <div id="formContainer" class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 hidden">
            <div class="flex justify-between items-end mb-4 border-b border-slate-200 pb-4">
                <div>
                    <h2 id="judulLomba" class="text-lg font-black text-slate-900 uppercase">GAYA BEBAS 50M</h2>
                    <p id="judulHeat" class="text-sm font-bold text-red-600 mt-1">HEAT 1</p>
                </div>
            </div>

            <!-- List Perenang Di-render di sini -->
            <div id="lanesContainer" class="space-y-3 mb-6">
                <!-- Template Baris (Akan diganti oleh JS) -->
            </div>

            <button id="btnSubmitWaktu" class="w-full bg-red-600 hover:bg-red-700 text-white font-black text-lg py-4 rounded-xl shadow-lg transition-transform active:scale-95 flex items-center justify-center gap-2">
                💾 SUBMIT HASIL HEAT INI
            </button>
        </div>

    </div>

    <!-- Script JS -->
    <script type="module" src="/src/live-result.js"></script>
</body>
</html>
